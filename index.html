<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>programetv.online</title>
    <script>
      // Safe guard against sandboxed iframe read-only window.fetch setter errors
      (function() {
        try {
          const originalFetch = window.fetch;
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch;
            },
            set(val) {
              console.warn('Sandbox Fetch Setter Guard: Intercepted attempt to modify read-only window.fetch:', val);
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Sandbox Fetch Protection not applicable:', e);
        }
      })();
    </script>
  </head>

        });
    </script>
  </body>
